<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trivia Challenge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style_trivia.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Trivia Challenge
            </span>
        </div>
    </nav>

    <main class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow-sm">
                    <div class="card-body">

                        <h2 class="card-title text-center">
                            Test Your Knowledge
                        </h2>

                        <p class="text-center text-muted">
                            Choose a difficulty and get a trivia question.
                        </p>


                        <label for="difficulty" class="form-label">
                            Difficulty
                        </label>

                        <select id="difficulty" class="form-select mb-3">

                            <option value="easy">
                                Easy
                            </option>

                            <option value="medium">
                                Medium
                            </option>

                            <option value="hard">
                                Hard
                            </option>

                        </select>

                        <button
                            id="getQuestionButton"
                            class="btn btn-primary w-100">

                            Get Question

                        </button>

                    </div>
                </div>

            </div>
        </div>



        <div class="text-center mt-4">

            <h4>
                Score: <span id="score">0</span>
            </h4>

        </div>


        <div id="questionSection" class="row justify-content-center mt-3">

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h3 id="question">
                            Click "Get Question" to begin.
                        </h3>


                        <div id="answers" class="mt-4">


                        </div>


                        <p
                            id="result"
                            class="text-center fw-bold mt-4">
                        </p>


                        <button
                            id="nextQuestionButton"
                            class="btn btn-secondary w-100 mt-2"
                            style="display: none;">

                            Next Question

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <p
            id="errorMessage"
            class="text-danger text-center mt-3">
        </p>

    </main>

    <script src="script_trivia.js"></script>

</body>

</html>
