
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Collection</title>
    <link rel="stylesheet" href="style_movies.css">
    <script src="movies.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>My Movie Collection</h1>
        <p>Keep track of the movies you love.</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2 id="form-title">Add a Movie</h2>

            <form id="movie-form">
                <label for="title">Movie Title</label>
                <input type="text" id="title" required>

                <label for="director">Director</label>
                <input type="text" id="director" required>

                <label for="year">Release Year</label>
                <input type="number" id="year" min="1888" required>

                <label for="genre">Genre</label>
                <input type="text" id="genre" required>

                <label for="rating">Rating (0–10)</label>
                <input
                    type="number"
                    id="rating"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

                <label for="watched">Have you watched it?</label>
                <select id="watched">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>

                <div class="form-buttons">
                    <button type="submit" id="submit-button">
                        Add Movie
                    </button>
                    <button type="button" id="cancel-button" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="collection-section">
            <h2>Your Movies</h2>
            <p id="movie-count">Loading movies...</p>
            <div id="movie-list" class="movie-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <p>Movie Collection Manager</p>
    </footer>
</body>
</html>
